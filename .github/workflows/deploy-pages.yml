name: Deploy to GitHub Pages

# GitHub Pages へ dist/ を公開する。
# 前提（リポジトリ作成後に一度だけ手動設定が必要。ワークフローからは設定できない）:
#   Settings → Pages → Build and deployment → Source: "GitHub Actions"
# 公開 URL は https://<user>.github.io/<repo>/ （カスタムドメイン不要）。
# ビルドは相対 base ('./') の既定のままなので、リポジトリ名に依存しない。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時デプロイを直列化する（進行中のデプロイはキャンセルしない）
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
